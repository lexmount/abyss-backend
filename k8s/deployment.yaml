apiVersion: apps/v1
kind: Deployment
metadata:
  name: abyss-backend
  labels:
    app.kubernetes.io/name: abyss-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: abyss-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: abyss-backend
    spec:
      serviceAccountName: abyss-backend
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: abyss-backend
          image: docker.io/lexmount/abyss-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: abyss-backend-config
            - secretRef:
                name: abyss-backend-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
