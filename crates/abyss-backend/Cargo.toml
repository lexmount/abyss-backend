[package]
name = "abyss-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[features]
default = ["postgres-es"]
blackbox-bundled-pq = ["postgres-es", "dep:pq-sys"]
postgres-es = [
    "dep:diesel",
    "dep:diesel_migrations",
    "dep:reqwest",
]
sqlite-fts = ["dep:rusqlite"]

[dependencies]
async-trait.workspace = true
axum = "0.8"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.2", features = ["chrono", "postgres", "r2d2", "serde_json", "uuid"], optional = true }
diesel_migrations = { version = "2.2", features = ["postgres"], optional = true }
hex = "0.4"
pq-sys = { version = "0.7", features = ["bundled_without_openssl"], optional = true }
r2d2 = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v7"] }

[lints]
workspace = true
